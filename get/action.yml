name: 'ReleaseMe - Get (latest) GitHub Release'
author: 'Kevin de Jong'
description: >
  Retrieves the (latest) GitHub Release associated with the current branch,
  or of another repository, and optionally downloads its assets

branding:
  icon: 'code'
  color: 'white'

inputs:
  token:
    description: 'GitHub token used to access GitHub (eg. github.token)'
    required: false

  versioning:
    description: Versioning scheme to apply
    required: false
    default: 'semver'

  prefix:
    description: 'Prefix used for the version (eg. v)'
    required: false

  tag:
    description: 'GitHub Release to retrieve (by tag)'
    required: false
    default: 'latest'

  name:
    description: 'GitHub Release to retrieve (by name)'
    required: false

  repository:
    description: 'Repository (owner/name) to retrieve the GitHub Release from, defaults to the current repository'
    required: false

  download:
    description: 'Multiline list of GitHub Release asset names (or labels, or glob patterns) to download'
    required: false

  path:
    description: 'Directory to download the GitHub Release assets to'
    required: false
    default: '_assets'

outputs:
  release:
    description: 'JSON object containing the GitHub Release information'

  files:
    description: 'JSON array containing the paths of the downloaded GitHub Release assets'

runs:
  using: 'node24'
  main: '../lib/get/index.js'
